name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish fork update after checks pass (main only)
        type: boolean
        required: false
        default: false
      release_version:
        description: Fork version (blank for next patch; for example 1.1.0)
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh --sources /etc/apt/sources.list.d/ubuntu.sources

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npx tsc --noEmit
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check
      - run: cargo test

  fork-release:
    needs: check
    if: >-
      github.repository == 'EricRasputin/monocode-eric' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release
    permissions:
      contents: write
    uses: ./.github/workflows/fork-release.yml
    with:
      version: ${{ inputs.release_version }}
    secrets:
      updater-private-key: ${{ secrets.FORK_UPDATER_PRIVATE_KEY }}
