name: Fork release

# CI calls this only for an explicitly requested release after all checks pass on main.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
    secrets:
      updater-private-key:
        required: true

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select fork release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/fork-release.mjs version "$FORK_REQUESTED_VERSION"

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    env:
      FORK_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-${{ matrix.target }}
      - run: npm ci
      - name: Bundle fork release notes
        run: node scripts/fork-release.mjs prepare "$FORK_VERSION"
      - name: Build and sign fork update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.updater-private-key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'FORK_UPDATER_PRIVATE_KEY is missing'; exit 1; }
          npm run build:fork -- --ci --target '${{ matrix.target }}' --config "{\"version\":\"$FORK_VERSION\"}"
      - name: Verify app and stage update
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          APP="target/$BUILD_TARGET/release/bundle/macos/MonoCode Fork.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.monocode.fork.worktrees'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$FORK_VERSION"
          EXPECTED_ARCH=x86_64
          if [[ "$BUILD_TARGET" == aarch64-* ]]; then EXPECTED_ARCH=arm64; fi
          test "$(lipo -archs "$APP/Contents/MacOS/monocode")" = "$EXPECTED_ARCH"
          codesign --verify --deep --strict "$APP"
          node scripts/fork-release.mjs stage "$FORK_VERSION" "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: fork-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    env:
      FORK_VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish complete update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fork-release.mjs publish "$FORK_VERSION"
